networks:
  app-net:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  api-node-modules:
  worker-node-modules:

services:
  # 1. Redis Service
  redis:
    image: redis:7.2-alpine
    container_name: dev-redis
    restart: always
    command: ["/bin/sh", "/usr/local/bin/seed-battle-bots.sh"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/seed-battle-bots.sh:/usr/local/bin/seed-battle-bots.sh:ro
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. API Server
  api-server:
    build:
      context: .
      target: development
    container_name: api-server
    restart: always
    command: ["node", "/app/docker/development-entrypoint.cjs", "node", "--watch", "--import", "./src/telemetry-preload.js", "server.js"]
    environment:
      PROCESS_TYPE: api_server
      OTEL_SERVICE_NAME: khelba-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_NODE_EXPERIMENTAL_SDK_METRICS: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # 3. Dedicated Background Worker
  worker:
    build:
      context: .
      target: development
    container_name: background-worker
    restart: always
    stop_grace_period: 30s
    command: ["node", "/app/docker/development-entrypoint.cjs", "node", "--watch", "--import", "./src/telemetry-preload.js", "src/workers/start.js"]
    environment:
      PROCESS_TYPE: job_worker
      OTEL_SERVICE_NAME: khelba-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_NODE_EXPERIMENTAL_SDK_METRICS: "true"
    volumes:
      - .:/app
      - worker-node-modules:/app/node_modules
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      replicas: 1

  # 4. Prometheus Service (Fixed for Production)
  prometheus:
    image: prom/prometheus:latest
    container_name: dev-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-net

  # OpenTelemetry receives app logs and metrics over OTLP.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: dev-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    networks:
      - app-net
    depends_on:
      - loki

  # Local log storage; Grafana reads it through the provisioned Loki datasource.
  loki:
    image: grafana/loki:3.5.5
    container_name: dev-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - app-net

  # 5. Grafana Service (Fixed for Production)
  grafana:
    image: grafana/grafana:12.0.2
    container_name: dev-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Accessible on your PC at http://localhost:3001
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-net
    depends_on:
      - prometheus
